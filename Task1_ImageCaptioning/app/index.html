<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGE.AI - Caption Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #b0d4ff 0%, #d5effc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .top-tab-bar {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: min(620px, calc(100% - 48px));
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(10px);
            transition: opacity 0.25s ease, transform 0.25s ease, max-height 0.25s ease, padding 0.25s ease, margin 0.25s ease;
            z-index: 30;
        }

        .top-tab-bar.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(-18px);
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            margin: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .tab {
            flex: 1;
            border: none;
            background: transparent;
            color: #475569;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: linear-gradient(135deg, #5ab2f8 0%, #7dd3fc 100%);
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(90, 178, 248, 0.35);
        }

        .tab-toggle {
            border: none;
            background: #0f172a;
            color: white;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            min-width: 110px;
        }

        .dashboard-container {
            position: relative;
            width: 900px;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 64px;
        }

        /* Floating Image Preview Card */
        .floating-image-card {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 210px;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }
        .floating-image-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
            background: #f1f5f9;
        }

        /* Floating Tone Card (Friendly, No emoji) */
        .floating-tone-card {
            position: absolute;
            top: 140px;
            left: -80px;
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            width: 170px;
            font-size: 13px;
        }
        .floating-tone-card span {
            color: #64748b;
            font-size: 11px;
            display: block;
            margin-bottom: 4px;
        }
        .dropdown-mock {
            font-weight: 600;
            color: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Floating Industry Card */
        .floating-industry-card {
            position: absolute;
            top: 20px;
            right: 140px;
            background: #ffffff;
            padding: 12px 18px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            width: 200px;
            font-size: 13px;
        }
        .floating-industry-card span {
            color: #64748b;
            font-size: 11px;
            display: block;
            margin-bottom: 4px;
        }

        /* Main Center Card */
        .main-card {
            position: relative;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            width: 410px;
            box-shadow: 0 15px 35px rgba(0, 50, 120, 0.12);
            z-index: 10;
        }
        .logo-title {
            font-weight: 800;
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .logo-title span {
            color: #38bdf8;
        }
        .main-card p {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .input-label {
            font-size: 13px;
            font-weight: bold;
            color: #1e293b;
            display: block;
            margin-bottom: 8px;
        }
        .file-upload-box {
            position: relative;
            border: 2px dashed #cbd5e1;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 13px;
            color: #64748b;
        }
        .file-upload-box input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        button {
            background: #5ab2f8;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(90, 178, 248, 0.4);
            transition: background 0.2s;
        }
        button:hover {
            background: #399eea;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #output {
            margin-top: 15px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 12px;
            color: #1e293b;
            display: none;
            text-align: left;
            word-break: break-word;
        }

        .mascot-container {
            position: absolute;
            bottom: 0;
            right: -20px;
            width: 160px;
            height: 250px;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="top-tab-bar" id="tabBar">
        <button type="button" class="tab active">Dashboard</button>
        <button type="button" class="tab">Gallery</button>
        <button type="button" class="tab">Insights</button>
        <button type="button" class="tab-toggle" id="toggleTabBarBtn">Hide tab bar</button>
    </div>

    <div class="dashboard-container">
        <!-- Floating Tone Card (Friendly, No Emoji) -->
        <div class="floating-tone-card">
            <span>Tone</span>
            <div class="dropdown-mock">Friendly <span>▼</span></div>
        </div>

        <!-- Floating Image Preview Card -->
        <div class="floating-image-card">
            <img id="refPreview" src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=300" alt="Content">
        </div>

        <!-- Floating Industry Card -->
        <div class="floating-industry-card">
            <span>Your Industry</span>
            <div class="dropdown-mock" style="font-weight: 500; font-size: 12px;">Content Creator <span>▼</span></div>
        </div>

        <!-- Main Center Card -->
        <div class="main-card">
            <div class="logo-title">IMAGE<span>.AI</span></div>
            <p>Generate ideas and captions with NEW AI technology! Simply add a couple of ideas and we'll help bring it to life.</p>
            
            <form id="uploadForm">
                <label class="input-label">What is your post about?</label>
                <div class="file-upload-box">
                    <span id="fileNameText">Click to upload image or drag & drop</span>
                    <input type="file" id="fileInput" accept="image/*" required>
                </div>

                <button type="submit" id="btn">GENERATE NEW CAPTION</button>
            </form>

            <div id="output"></div>
        </div>

        <!-- Mascot Graphic -->
        <div class="mascot-container">
            <svg viewBox="0 0 150 220" width="100%" height="100%">
                <path d="M 60 120 L 60 220 L 140 220 L 140 120 Z" fill="#e2e8f0" rx="20"/>
                <rect x="110" y="80" width="10" height="140" fill="#ffffff" opacity="0.6"/>
                <path d="M 40 60 L 50 120 L 110 120 L 120 60 Z" fill="#e2e8f0"/>
                <polygon points="40,60 25,20 55,45" fill="#e2e8f0"/>
                <polygon points="120,60 135,20 105,45" fill="#e2e8f0"/>
                <rect x="55" y="70" width="55" height="35" rx="8" fill="#0f172a"/>
                <circle cx="72" cy="87" r="5" fill="#38bdf8"/>
                <circle cx="93" cy="87" r="5" fill="#38bdf8"/>
                <path d="M 77 100 Q 82 105 88 100" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
                <line x1="82" y1="60" x2="82" y2="40" stroke="#cbd5e1" stroke-width="3"/>
                <circle cx="82" cy="37" r="4" fill="#38bdf8"/>
                <rect x="30" y="80" width="15" height="15" rx="3" fill="#cbd5e1"/>
            </svg>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameText = document.getElementById('fileNameText');
        const refPreview = document.getElementById('refPreview');
        const uploadForm = document.getElementById('uploadForm');
        const btn = document.getElementById('btn');
        const output = document.getElementById('output');
        const tabBar = document.getElementById('tabBar');
        const toggleTabBarBtn = document.getElementById('toggleTabBarBtn');

        toggleTabBarBtn.addEventListener('click', () => {
            const hidden = tabBar.classList.toggle('hidden');
            toggleTabBarBtn.textContent = hidden ? 'Show tab bar' : 'Hide tab bar';
            toggleTabBarBtn.setAttribute('aria-label', hidden ? 'Show tab bar' : 'Hide tab bar');
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameText.textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    refPreview.src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            btn.disabled = true;
            btn.innerText = 'GENERATING...';
            output.style.display = 'none';

            try {
                const res = await fetch('/predict', { method: 'POST', body: formData });
                const data = await res.json();
                output.style.display = 'block';
                if (res.ok) {
                    output.innerHTML = '<strong>Generated Caption:</strong> ' + data.caption;
                } else {
                    output.innerHTML = '<strong>Error:</strong> ' + (data.detail || 'Processing failed');
                }
            } catch (err) {
                output.style.display = 'block';
                output.innerHTML = '<strong>Error:</strong> Failed to connect to server.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'GENERATE NEW CAPTION';
            }
        });
    </script>
</body>
</html>
